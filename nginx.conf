server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Indispensable pour Flutter Web SPA routing
    # Toutes les routes inconnues retournent index.html
    # et Flutter gère le routing côté client
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache pour les assets statiques
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
